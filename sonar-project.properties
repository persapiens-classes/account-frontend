sonar.projectKey=persapiens-classes_account-frontend
sonar.organization=persapiens-classes

# Exclude specific rule "Add some testes to this file or delete it"
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.e1.resourceKey=cypress/e2e/owner/owner.cy.ts
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.e2.resourceKey=cypress/e2e/category/category.cy.ts
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.e3.resourceKey=cypress/e2e/account/account.cy.ts
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.e4.resourceKey=cypress/e2e/entry/entry.cy.ts
sonar.issue.ignore.multicriteria.e5.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.e5.resourceKey=cypress/e2e/balance/balance.cy.ts

# Basic configurations
sonar.sources=src
sonar.tests=src,cypress
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/*.cy.ts

# Coverage configurations
sonar.typescript.lcov.reportPaths=coverage/merged/lcov.info
sonar.coverage.exclusions=src/test-setup.ts,src/app/shared/test-utils.ts,src/app/models/model-test-helpers.ts,src/environments/environment.codespace.ts,src/environments/environment.prod.ts

# Additional configurations
sonar.typescript.tsconfigPath=tsconfig.json

sonar.projectKey=persapiens-classes_account-frontend
sonar.organization=persapiens-classes

# Exclude specific rule "Functions should not be nested too deeply"
#sonar.issue.ignore.multicriteria=e1
#sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S2004
#sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.test.ts

# Basic configurations
sonar.sources=src
sonar.tests=src,cypress
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/*.cy.ts

# Coverage configurations
sonar.typescript.lcov.reportPaths=coverage/merged/lcov.info
sonar.coverage.exclusions=src/test-setup.ts,src/app/shared/test-utils.ts,src/app/shared/http-client-test-mock.ts,src/app/category/category-test-helpers.ts,src/app/models/model-test-helpers.ts,src/environments/environment.codespace.ts,src/environments/environment.prod.ts

# Additional configurations
sonar.typescript.tsconfigPath=tsconfig.json

name: Deploy Angular to GitHub Pages

on:
  push:
  pull_request:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    container: mcr.microsoft.com/devcontainers/base:2.2.3-trixie

    env:
      PNPM_CONFIG_STORE_DIR: '/pnpm_data/pnpm_store'
      PNPM_CONFIG_CACHE_DIR: '/pnpm_data/pnpm_cache'
      PNPM_CONFIG_STATE_DIR: '/pnpm_data/pnpm_state'
      CYPRESS_CACHE_FOLDER: '/pnpm_data/cypress_cache'

    steps:
      - name: Source code checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Cache
        uses: actions/cache@v6.1.0
        with:
          path: /pnpm_data
          key: ${{ runner.os }}-unified-cache-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-unified-cache-

      - name: Install chromium, pnpm, dependencies and cypress
        run: bash .devcontainer/post-create.sh

      # post-create changes PATH to include pnpm,
      # we need to ensure that the next steps in the GitHub Actions workflow know about this new PATH.
      - name: Export PNPM PATH for next steps
        run: echo "$HOME/.local/share/pnpm/bin" >> $GITHUB_PATH

      - name: Oxfmt run
        run: pnpm format:check

      - name: Jscpd run
        run: pnpm check-duplication

      - name: Jscpd upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: jscpd-reports
          path: |
            report/jscpd/

      - name: Fallow gate (unused code)
        run: pnpm fallow:dead-code --format github-annotations

      - name: Fallow gate (duplicates)
        run: pnpm fallow:dupes --format github-annotations

      - name: Fallow HTML report generate
        if: ${{ always() }}
        run: pnpm exec fallow viz --no-open --out fallow-viz.html

      - name: Fallow HTML report upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fallow-html-report
          path: |
            fallow-viz.html

      - name: Lint run
        run: pnpm lint

      - name: Tests (Unit and Integration with Angular CLI) run
        run: pnpm clean:unit:ng:coverage && pnpm test:unit:ng:coverage

      - name: Tests (Unit and Integration with Vitest) run
        run: pnpm clean:unit:coverage && pnpm test:unit:coverage

      - name: Tests (E2E with Vite and Cypress) run
        run: pnpm clean:e2e:coverage && pnpm test:e2e:coverage

      - name: Merge coverage run
        run: pnpm merge:coverage

      - name: Coverage upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage
          path: |
            coverage/

      - name: Debug SonarCloud Analysis
        run: |
          echo "📁 TypeScript files in project:"
          find src -name "*.ts" -not -path "*/node_modules/*" | head -10
          echo ""
          echo "📊 Files with coverage in LCOV:"
          grep "^SF:" coverage/merged/lcov.info | sed 's/SF://' | head -10
          echo ""
          echo "📈 Sample coverage data:"
          grep -A 3 -B 1 "LF:" coverage/merged/lcov.info | head -10
          echo ""
          echo "🎯 Detail field component coverage:"
          grep -A 10 -B 2 "detail-field.component" coverage/merged/lcov.info
          echo ""
          echo "📋 Coverage summary:"
          grep -E "^(SF|LF|LH):" coverage/merged/lcov.info | head -15
        if: github.actor != 'dependabot[bot]'

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        if: ${{ github.actor != 'dependabot[bot]' && github.repository == 'persapiens-classes/account-frontend' }}

      - name: Build project
        run: pnpm build:prod

      - name: Deploy on GitHub Pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: dist/browser
          token: ${{ secrets.GITHUB_TOKEN }}
          clean: true
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'persapiens-classes/account-frontend' }}
